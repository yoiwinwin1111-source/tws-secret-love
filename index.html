function renderOthers(){mount('myprofile','我的资料',`<div style="text-align:center;padding:50px 0 25px">${photo('dohoon','avatar round','金道勋')}<h2>金道勋</h2><p class="subtitle">잘 지내고 있어요.</p></div><button class="primary" data-chat="申惟">和申惟聊天</button><button class="outline" data-go="settings">手机设置</button>`);mount('messages','信息',`<button class="listrow" data-chat="经纪人"><span class="avatar text round">行</span><div class="body"><strong>行程提醒</strong><p>明早 07:00 大厅集合。带外套，车上补觉。</p></div><span class="trailing">昨天</span></button><p class="credit">虚构行程消息</p>`);mount('youtube','YouTube',`<h2 class="smallheading">TWS Official</h2>${photo('group','photo-preview','TWS官方公开照片')}<a class="primary" href="https://www.youtube.com/@TWS_PLEDIS" target="_blank" rel="noopener noreferrer">观看官方频道 ↗</a><p class="credit">官方公开视频在原频道播放。</p>`,{dark:true});mount('camera','相机',`<div class="camera-view" style="background-image:url('${MEDIA.group}')"></div><button class="shutter" data-action="shutter" aria-label="保存模拟快照"></button><p class="credit" style="text-align:center">模拟取景 · 不调用你的摄像头</p>`,{dark:true});mount('maps','地图',`<div class="mapcard"><svg viewBox="0 0 330 310" role="img" aria-label="练习室到宿舍的虚构示意路线"><path d="M0 50h330M0 140h330M0 240h330M55 0v310M190 0v310M290 0v310" stroke="#f7f9f5" stroke-width="22"/><path d="M55 75v65h135v100h65" stroke="#3389f5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="55" cy="75" r="9" fill="#3389f5" stroke="white" stroke-width="4"/><circle cx="255" cy="240" r="10" fill="#ff5d58" stroke="white" stroke-width="4"/></svg><div class="maplabel" style="left:18px;top:24px">练习室</div><div class="maplabel" style="left:153px;top:150px">便利店</div><div class="maplabel" style="right:20px;bottom:20px">宿舍</div></div><h2 class="smallheading">回去的路</h2><p style="font-size:14px;line-height:1.8">“你先上车。我跟其他人一起回去。”</p><p class="credit">虚构场景示意，无真实地址或定位。</p>`)}
function renderSpotify(){mount('spotify','Spotify',`${photo('dohoon','playlist-cover','歌单封面')}<h2 class="playlist-title">비공개 사랑<br>不能公开的喜欢</h2><div class="playlist-author">${photo('dohoon','','金道勋')}金道勋 <span class="subtitle">· ${songs.length} 首</span></div><div class="playlist-tools"><div>${icon('heart')}${icon('down')}${icon('more')}</div><button class="sp-play" data-action="play" aria-label="播放歌单">${icon(audio.paused?'play':'pause')}</button></div><div id="songlist">${songRows()}</div><p class="audio-disclosure">本站可播放原创氛围试听。正版歌曲从播放器内的 Spotify 入口打开。</p>`,{dark:true});$('screen-spotify').style.background='linear-gradient(#4b5c59,#111 48%)';$('screen-spotify').querySelector('.page-scroll').classList.add('sp-scroll')}
function songRows(){return songs.map(([t,a],i)=>`<button class="song-row ${i===songIndex&&!audio.paused?'selected':''}" data-song="${i}" aria-label="播放${esc(t)}"><span class="number">${i===songIndex&&!audio.paused?'Ⅱ':i+1}</span><span class="body"><strong>${t}</strong><p>${a}</p></span>${icon('more')}</button>`).join('')}
function fmt(t){if(!Number.isFinite(t))t=0;return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function updatePlayer(){const [t,a]=songs[songIndex];$('minititle').textContent=t;$('miniartist').textContent=a;$('player-title').textContent=t;$('player-artist').textContent=a;$('spotify-original').href='https://open.spotify.com/search/'+encodeURIComponent(t+' '+a);$('mini-toggle').innerHTML=$('player-toggle').innerHTML=icon(audio.paused?'play':'pause');$('mini-toggle').setAttribute('aria-label',audio.paused?'播放':'暂停');$('player-toggle').setAttribute('aria-label',audio.paused?'播放':'暂停');$('mini').style.display=active==='spotify'&&!playerOpen?'flex':'none';$('seek').max=audio.duration||24;$('seek').value=audio.currentTime;$('elapsed').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration||24);$('miniprogress').style.width=100*audio.currentTime/(audio.duration||24)+'%';if($('songlist'))$('songlist').innerHTML=songRows();const b=$('screen-spotify').querySelector('.sp-play');if(b)b.innerHTML=icon(audio.paused?'play':'pause')}
async function playSong(i){songIndex=(i+songs.length)%songs.length;audio.currentTime=0;try{await audio.play()}catch{notify('请再点一次播放，或从 Spotify 打开正版歌曲。')}updatePlayer()}
function togglePlay(){if(audio.paused)audio.play().catch(()=>notify('请再点一次播放。'));else audio.pause();updatePlayer()}
function skipSong(d){playSong(isShuffle?Math.floor(Math.random()*songs.length):songIndex+d)}
function expandPlayer(){playerOpen=true;$('player').style.display='block';updatePlayer()}
function collapsePlayer(){playerOpen=false;$('player').style.display='none';updatePlayer()}
function renderIncoming(){$('screen-incoming').innerHTML=`<div class="call-background" style="background-image:url('${MEDIA.shinyu}')"></div><div class="incoming-info">${photo('shinyu','avatar','申惟官方照片')}<h2>申惟</h2><p>Instagram 视频来电</p><small>虚构通话模拟</small></div><div class="answer-actions"><div class="call-action"><button class="reject" data-action="hangup" aria-label="拒接">${icon('phone')}</button><span>拒绝</span></div><div class="call-action"><button class="accept" data-action="answer" aria-label="接听">${icon('video')}</button><span>接听</span></div></div>`}
function clearCall(){clearInterval(callInterval);callTimers.forEach(clearTimeout);callTimers=[]}
function startCall(){clearCall();micMuted=false;camOff=false;go('videocall');callStart=Date.now();$('screen-videocall').innerHTML=`<div class="call-background" style="background-image:url('${MEDIA.shinyu}')"></div><div class="video-top"><strong>申惟</strong><small id="calltime">00:00 · 模拟通话</small></div>${photo('dohoon','video-self','本地模拟画面 · 官方照片')}<div class="video-caption" id="callcaption"><small>虚构剧本 · 静态照片模拟画面</small>“听得到吗？今天嗓子有点哑。”</div><div class="video-controls"><button data-action="flip" aria-label="切换模拟画面">${icon('flip')}</button><button id="micbutton" data-action="mic" aria-label="麦克风" aria-pressed="false">${icon('mic')}</button><button id="cambutton" data-action="cam" aria-label="摄像头" aria-pressed="false">${icon('video')}</button><button class="end" data-action="hangup" aria-label="挂断">${icon('phone')}</button></div><form class="compose video-compose" id="videoform"><input id="videoinput" placeholder="发消息…" aria-label="通话消息"><button class="send" type="submit" aria-label="发送通话消息">${icon('up')}</button></form>`;callInterval=setInterval(()=>{if($('calltime'))$('calltime').textContent=fmt((Date.now()-callStart)/1000)+' · 模拟通话'},1000);[[7,'先喝水。'],[14,'外套明天拿给你。小票我另外放好了。'],[23,'八个月。不是没记得。'],[34,'志薫今天陪你出去了？有人陪着你，我就放心一点。'],[46,'明天练习的时候，不用一直避开我。平常一点就好。'],[58,'那我现在问。吃了吗？'],[75,'走廊有人。先挂，明天见。']].forEach(([sec,t])=>callTimers.push(setTimeout(()=>{if(active==='videocall')$('callcaption').innerHTML='<small>申惟 · 虚构对话</small>'+esc(t)},sec*1000)))}
function hangup(){clearCall();go('instagram');notify('通话已结束')}
function applyWallpaper(){const k=load('wallpaper-key','shinyu');const v=k.startsWith('album-')?ALBUM[Number(k.slice(6))]?.src:MEDIA[k];$('wallpaper').style.backgroundImage=`url('${v||MEDIA.shinyu}')`}
function go(id){if(active==='videocall'&&id!=='videocall')clearCall();if(active==='chat'&&id!=='chat')renderKakao();if(id==='incoming')renderIncoming();if(id==='phone')renderPhone();if(id==='kakao')renderKakao();if(id==='photos')renderPhotos();if(id==='notes')renderNotes();if(id==='search')renderSearch();if(id!=='spotify')collapsePlayer();active=id;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+id));const light=['phone','kakao','chat','photos','notes','maps','settings','search','myprofile','messages'].includes(id);$('phone').className=(id==='home'||id==='lock'?id:'inapp '+(light?'light':'dark'));$('homebar').setAttribute('aria-label',id==='lock'?'解锁':'返回桌面');updatePlayer()}
function closeApp(){if(playerOpen){collapsePlayer();return}if(active==='videocall'||active==='incoming'){hangup();return}if(active==='viewer'){go(viewerSource==='album'?'photos':'instagram');return}if(active==='chat'){go('kakao');return}go('home')}
document.addEventListener('click',e=>{const b=e.target.closest('button,a,[data-action]');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.chat){openChat(b.dataset.chat);return}if(b.dataset.song!==undefined){playSong(+b.dataset.song);return}if(b.dataset.album!==undefined){openPhoto(+b.dataset.album);return}if(b.dataset.photoKey){openOfficialPhoto(b.dataset.photoKey);return}if(b.dataset.phoneTab){renderPhone(b.dataset.phoneTab);return}if(b.dataset.callFilter){phoneFilter=b.dataset.callFilter;renderPhone();return}if(b.dataset.digit){$('dialnumber').textContent=($('dialnumber').textContent+b.dataset.digit).slice(0,18);return}if(b.dataset.heart||b.dataset.save){const k=b.dataset.heart?'heart:':'saved:';const key=k+(b.dataset.heart||b.dataset.save);const on=!load(key,false);save(key,on);b.style.color=on?(b.dataset.heart?'#ff4265':'#fff'):'';b.querySelector('svg').style.fill=on?'currentColor':'none';notify(on?'已保存到这台手机':'已取消');return}if(b.dataset.xTab){document.querySelectorAll('.x-tabs button').forEach(x=>x.classList.toggle('selected',x===b));$('diaryposts').style.display=b.dataset.xTab==='posts'?'block':'none';notify(b.dataset.xTab==='posts'?'私人日记':b.dataset.xTab==='media'?'这个私人账号还没有媒体':'还没有回复');return}const a=b.dataset.action;if(!a)return;switch(a){case'weather':notify('首尔 · 故事天气：多云，12°。');break;case'chatplus':notify('本页支持文字聊天，内容仅保存在本机。');break;case'incoming':go('incoming');break;case'answer':startCall();break;case'hangup':hangup();break;case'mic':micMuted=!micMuted;b.setAttribute('aria-pressed',micMuted);b.innerHTML=icon(micMuted?'micoff':'mic');notify(micMuted?'模拟麦克风已静音':'模拟麦克风已开启');break;case'cam':camOff=!camOff;b.setAttribute('aria-pressed',camOff);$('screen-videocall').querySelector('.video-self').classList.toggle('off',camOff);notify(camOff?'模拟画面已关闭':'模拟画面已开启');break;case'flip':$('screen-videocall').querySelector('.video-self').style.transform=$('screen-videocall').querySelector('.video-self').style.transform?'':'scaleX(-1)';notify('已切换模拟画面');break;case'play':togglePlay();break;case'expand-player':expandPlayer();break;case'collapse-player':collapsePlayer();break;case'nextsong':skipSong(1);break;case'prevsong':skipSong(-1);break;case'shuffle':isShuffle=!isShuffle;b.style.color=isShuffle?'#1ed760':'';b.setAttribute('aria-pressed',isShuffle);break;case'repeat':isRepeat=!isRepeat;b.style.color=isRepeat?'#1ed760':'';b.setAttribute('aria-pressed',isRepeat);break;case'prevphoto':openPhoto(photoIndex-1);break;case'nextphoto':openPhoto(photoIndex+1);break;case'wallpaper':save('wallpaper-key',viewerSource==='album'?'album-'+photoIndex:viewerKey);applyWallpaper();notify('已设为锁屏壁纸');break;case'shutter':notify('模拟快照已保存在相册中。');go('photos');break;case'flash':b.style.background=b.style.background?'':'#fff';b.style.color=b.style.color?'':'#111';break;case'official':case'ig-official-search':window.open('https://www.instagram.com/tws_pledis/','_blank','noopener,noreferrer');break;case'ig-top':$('screen-instagram').querySelector('.page-scroll').scrollTo({top:0,behavior:'smooth'});break;case'privatecomment':notify('这里只浏览公开原帖；如需公开互动，请打开 Instagram 原帖。');break;case'dial':notify('这是虚构手机，不会拨打真实电话。');break;}});
document.addEventListener('submit',e=>{if(e.target.id==='chatform'){e.preventDefault();sendChat()}if(e.target.id==='videoform'){e.preventDefault();const v=$('videoinput').value.trim();if(v){$('callcaption').innerHTML='<small>我 · 本地通话消息</small>'+esc(v);$('videoinput').value=''}}});
document.addEventListener('input',e=>{if(e.target.id==='noteseditor'){save('notes',e.target.value);$('notestate').textContent='已保存 · '+time()}if(e.target.id==='searchinput')$('searchresults').innerHTML=searchResults(e.target.value.trim());if(e.target.id==='seek'){audio.currentTime=+e.target.value;updatePlayer()}});
$('closeapp').addEventListener('click',closeApp);$('homebar').addEventListener('click',()=>{if(active==='lock')go('home');else{clearCall();go('home')}});
let swipe=null;$('screen-lock').addEventListener('pointerdown',e=>{swipe={x:e.clientX,y:e.clientY}});$('screen-lock').addEventListener('pointerup',e=>{if(swipe&&swipe.y-e.clientY>45)go('home');swipe=null});
let photoSwipe=null;$('screen-viewer').addEventListener('pointerdown',e=>{if(e.target.id==='fullphoto')photoSwipe={x:e.clientX,y:e.clientY}});$('screen-viewer').addEventListener('pointerup',e=>{if(photoSwipe&&viewerSource==='album'&&Math.abs(e.clientX-photoSwipe.x)>45&&Math.abs(e.clientY-photoSwipe.y)<100)openPhoto(photoIndex+(e.clientX<photoSwipe.x?1:-1));photoSwipe=null});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeApp();if(active==='viewer'&&viewerSource==='album'&&e.key==='ArrowRight')openPhoto(photoIndex+1);if(active==='viewer'&&viewerSource==='album'&&e.key==='ArrowLeft')openPhoto(photoIndex-1)});
audio.addEventListener('play',updatePlayer);audio.addEventListener('pause',updatePlayer);audio.addEventListener('timeupdate',()=>{if($('seek')){$('seek').value=audio.currentTime;$('elapsed').textContent=fmt(audio.currentTime);$('miniprogress').style.width=(audio.currentTime/(audio.duration||24)*100)+'%'}});audio.addEventListener('loadedmetadata',updatePlayer);audio.addEventListener('ended',()=>{if(isRepeat){audio.currentTime=0;audio.play().catch(()=>{})}else skipSong(1)});audio.addEventListener('error',()=>notify('试听暂时不可用，请通过 Spotify 打开正版歌曲。'));
function viewport(){if(innerWidth<600)document.documentElement.style.setProperty('--app-height',(window.visualViewport?.height??innerHeight)+'px')};window.visualViewport?.addEventListener('resize',viewport);window.addEventListener('resize',viewport);viewport();
$('statusicons').innerHTML=icon('signal')+icon('wifi')+icon('battery').replace('<svg ','<svg class="battery" ');$('closeapp').innerHTML=icon('close');$('lockbadge').innerHTML=icon('lock');$('locknoticeicon').innerHTML=icon('kakao');$('flashlight').innerHTML=icon('flash');$('lockcamera').innerHTML=icon('camera');$('miniimage').src=$('playerimage').src=MEDIA.dohoon;$('playerback').innerHTML=icon('down');$('shuffle').innerHTML=icon('shuffle');$('repeat').innerHTML=icon('repeat');$('previous').innerHTML=icon('prev');$('next').innerHTML=icon('next');renderHome();renderKakao();renderPhone();renderX();renderInstagram();renderPhotos();renderNotes();renderSettings();renderSearch();renderOthers();renderSpotify();applyWallpaper();renderClock();setInterval(renderClock,1000);go('lock');
</script></body></html>
